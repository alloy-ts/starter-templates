[package]
name = "object-store-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["async", "tokio_rt"] }
napi-derive = "3"
object_store = { version = "0.14.2", features = ["fs", "http", "aws", "azure", "gcp"] }
url = "2.5"
futures = "0.3"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
napi-build = "2"
